[package]
name = "localflow"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
anyhow = "1"
crossbeam-channel = "0.5"
cpal = "0.15"
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
arboard = "3"
dirs = "5"
rtrb = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# The elcapitan feature is what exposes CGEventPostToPid, which delivers the
# paste keystroke straight to the destination process instead of posting it
# session wide. Nothing here is newer than OS X 10.11.
core-graphics = { version = "0.24", features = ["elcapitan"] }
core-foundation = "0.10"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace", "libc"] }

